[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessfly-statepings"
version = "0.1.0"
description = "Research harness for history-bearing dynamics in the published ChessFly model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "Antti Luode"}]
dependencies = [
  "torch>=2.0",
  "safetensors>=0.4",
  "python-chess>=1.999",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chessfly-statepings = "chessfly_statepings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
